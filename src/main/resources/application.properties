spring.application.name=ecommerce-api
server.port=8080

# ---------- Base de datos: MySQL de XAMPP ----------
# XAMPP escucha en el puerto 3306. createDatabaseIfNotExist=true crea ecommerce_db si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# Por defecto XAMPP usa usuario "root" SIN contraseña.
# Si cambiaste la clave, definí las variables de entorno DB_USER / DB_PASSWORD (así no la subís a GitHub).
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# update: crea/actualiza las tablas automáticamente (ideal en desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita lecturas lazy fuera de la capa de servicio (se mapea a DTO dentro de @Transactional).
spring.jpa.open-in-view=false
